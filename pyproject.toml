[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="lottery-combination-lab"
version="0.1.0"
description="Controlled lottery candidate generation, filtering, selection, and audit."
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.26,<3"]

[project.optional-dependencies]
dev=["pytest>=8,<9"]

[project.scripts]
combination-lab="lottery_combination_lab.cli:main"

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]

[tool.setuptools.packages.find]
where=["src"]
